<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção Dona Balbina - Tortas</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --primary: #FF8C00; --secondary: #2c3e50; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--white); padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
        .online { background: #e6fffa; color: #38a169; }
        .offline { background: #fff5f5; color: #e53e3e; }
        
        .grid-tortas { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--white); border-radius: 15px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-top: 6px solid var(--primary); }
        .torta-nome { font-size: 1.4em; font-weight: 800; color: var(--secondary); margin: 0 0 15px 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .secao-loja { margin-bottom: 15px; background: #fafafa; padding: 10px; border-radius: 8px; }
        .loja-nome { font-size: 0.9em; font-weight: bold; color: #7f8c8d; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        
        .controles { display: flex; gap: 10px; align-items: center; }
        .btn-acao { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; background: white; cursor: pointer; font-weight: bold; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .btn-acao span { font-size: 0.7em; text-transform: uppercase; color: #999; }
        .btn-acao.ativo { background: #48bb78; border-color: #48bb78; color: white; }
        .btn-acao.ativo span { color: white; }
        
        .meta-tag { background: #edf2f7; padding: 4px 10px; border-radius: 6px; font-weight: bold; color: var(--secondary); font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="margin:0; color: var(--secondary);">🥧 Painel de Tortas</h1>
            <div id="data-atual" style="color: #666;">Carregando data...</div>
        </div>
        <div id="status-conexao" class="status-badge offline">🟡 Conectando...</div>
    </div>

    <div id="grid-tortas" class="grid-tortas">
        </div>

    <script>
        // CONFIGURAÇÃO INICIAL
        const LINK_API = 'https://api-painel-tortas.onrender.com'; // <--- SEU LINK DO RENDER AQUI
        const socket = io(LINK_API);
        
        let produtosDaVez = [];
        let estadoChecklist = {};
        const diaSemana = new Date().getDay(); // 0 (Dom) a 6 (Sáb)

        const statusConexao = document.getElementById('status-conexao');
        const gridTortas = document.getElementById('grid-tortas');

        // 1. CARREGAR PRODUTOS DA API
        async function buscarProdutos() {
            try {
                const response = await fetch(LINK_API + '/produtos');
                produtosDaVez = await response.json();
                renderizarPainel();
            } catch (e) {
                console.error("Erro ao buscar produtos:", e);
            }
        }

        // 2. DESENHAR O PAINEL NA TELA
        function renderizarPainel() {
            gridTortas.innerHTML = '';
            
            produtosDaVez.forEach(torta => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <h2 class="torta-nome">${torta.nome}</h2>
                    
                    <div class="secao-loja">
                        <div class="loja-nome">🏢 Centro (Manhã) <span class="meta-tag">Meta: ${torta.centroManha[diaSemana]}</span></div>
                        <div class="controles">
                            ${gerarBotao(torta.id, 'centro_manha', 'produzir', '🥣 Produzir')}
                            ${gerarBotao(torta.id, 'centro_manha', 'separar', '📦 Separar')}
                        </div>
                    </div>

                    <div class="secao-loja">
                        <div class="loja-nome">🏢 Centro (Tarde) <span class="meta-tag">Meta: ${torta.centroTarde[diaSemana]}</span></div>
                        <div class="controles">
                            ${gerarBotao(torta.id, 'centro_tarde', 'produzir', '🥣 Produzir')}
                            ${gerarBotao(torta.id, 'centro_tarde', 'separar', '📦 Separar')}
                        </div>
                    </div>

                    <div class="secao-loja">
                        <div class="loja-nome">🏪 Sabugo (Diário) <span class="meta-tag">Meta: ${torta.sabugo[diaSemana]}</span></div>
                        <div class="controles">
                            ${gerarBotao(torta.id, 'sabugo_diario', 'produzir', '🥣 Produzir')}
                            ${gerarBotao(torta.id, 'sabugo_diario', 'separar', '📦 Separar')}
                        </div>
                    </div>

                    <div class="secao-loja">
                        <div class="loja-nome">🏪 Lages (Diário) <span class="meta-tag">Meta: ${torta.lages[diaSemana]}</span></div>
                        <div class="controles">
                            ${gerarBotao(torta.id, 'lages_diario', 'produzir', '🥣 Produzir')}
                            ${gerarBotao(torta.id, 'lages_diario', 'separar', '📦 Separar')}
                        </div>
                    </div>
                `;
                gridTortas.appendChild(card);
            });
        }

        function gerarBotao(id, chaveLoja, tipo, label) {
            const ativo = estadoChecklist[chaveLoja]?.[`id_${id}`]?.[tipo] ? 'ativo' : '';
            return `
                <button class="btn-acao ${ativo}" onclick="clicarBotao('${chaveLoja}', ${id}, '${tipo}')">
                    ${label}
                    <span>${tipo}</span>
                </button>
            `;
        }

        // 3. LOGICA DE CLIQUES (TEMPO REAL)
        function clicarBotao(chaveEstado, produtoId, tipoAcao) {
            socket.emit('marcarAcao', { chaveEstado, produtoId, tipoAcao });
        }

        socket.on('connect', () => {
            statusConexao.className = 'status-badge online';
            statusConexao.innerText = '🟢 Online';
            buscarProdutos();
        });

        socket.on('disconnect', () => {
            statusConexao.className = 'status-badge offline';
            statusConexao.innerText = '🔴 Desconectado';
        });

        socket.on('sincronizarInicial', (dados) => {
            estadoChecklist = dados.checklist;
            document.getElementById('data-atual').innerText = 'Produção para: ' + dados.data;
            renderizarPainel();
        });

        socket.on('atualizarPainel', (novaMemoria) => {
            estadoChecklist = novaMemoria;
            renderizarPainel();
        });

        // Se o gerente mudar a lista de produtos, o painel atualiza sozinho!
        socket.on('produtosAtualizados', (novosProdutos) => {
            produtosDaVez = novosProdutos;
            renderizarPainel();
        });

    </script>
</body>
</html>
